<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>塔罗牌 · AI解牌</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #fafafa;
    --bg-secondary: #f0f0f0;
    --bg-tertiary: #e8e8e8;
    --text: #1a1a1a;
    --text-secondary: #555;
    --text-muted: #999;
    --border: #e0e0e0;
    --border-light: #eee;
    --accent: #1a1a1a;
    --accent-text: #fff;
    --user-msg: #1a1a1a;
    --user-msg-text: #fff;
    --ai-msg: #fff;
    --shadow: 0 1px 3px rgba(0,0,0,0.06);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.08);
    --overlay: rgba(0,0,0,0.4);
  }
  body.dark {
    --bg: #161616;
    --bg-secondary: #1f1f1f;
    --bg-tertiary: #2a2a2a;
    --text: #e8e8e8;
    --text-secondary: #aaa;
    --text-muted: #666;
    --border: #333;
    --border-light: #2a2a2a;
    --accent: #e8e8e8;
    --accent-text: #1a1a1a;
    --user-msg: #3a3a3a;
    --user-msg-text: #e8e8e8;
    --ai-msg: #1f1f1f;
    --shadow: 0 1px 3px rgba(0,0,0,0.3);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.5);
    --overlay: rgba(0,0,0,0.6);
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    overflow: hidden;
    transition: background 0.3s, color 0.3s;
  }
  .svg-icon { width: 1em; height: 1em; fill: currentColor; vertical-align: -0.125em; }
  .svg-icon-stroke { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  /* 顶部栏 */
  .topbar {
    height: 52px;
    background: var(--ai-msg);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center;
    padding: 0 20px; gap: 16px;
    position: relative; z-index: 10;
    transition: background 0.3s;
  }
  .topbar-title {
    font-size: 15px; font-weight: 600; letter-spacing: 1px;
    display: flex; align-items: center; gap: 8px;
  }
  .mode-switch {
    display: flex; background: var(--bg-secondary);
    border-radius: 8px; padding: 3px; margin-left: 20px;
  }
  .mode-btn {
    padding: 6px 16px; border: none; background: transparent;
    font-size: 13px; cursor: pointer; border-radius: 6px;
    color: var(--text-secondary); transition: all 0.2s; font-family: inherit;
  }
  .mode-btn.active {
    background: var(--ai-msg); color: var(--text);
    font-weight: 600; box-shadow: var(--shadow);
  }
  .topbar-right {
    margin-left: auto; display: flex; align-items: center; gap: 8px;
  }
  .icon-btn {
    width: 34px; height: 34px;
    border: 1px solid var(--border); background: var(--ai-msg);
    border-radius: 8px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; color: var(--text-secondary);
  }
  .icon-btn:hover { background: var(--bg-secondary); color: var(--text); }
  .icon-btn.active { background: var(--bg-secondary); color: var(--text); border-color: var(--text-muted); }
  .new-chat-btn {
    padding: 7px 14px; border: 1px solid var(--border);
    background: var(--ai-msg); border-radius: 8px; cursor: pointer;
    font-size: 13px; font-family: inherit; transition: all 0.2s;
    display: flex; align-items: center; gap: 6px; color: var(--text-secondary);
  }
  .new-chat-btn:hover { background: var(--bg-secondary); color: var(--text); }

  /* 主体 */
  .main { display: flex; height: calc(100vh - 52px); }

  /* 侧边栏 */
  .sidebar {
    width: 320px; min-width: 320px;
    background: var(--ai-msg);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
    transition: margin-left 0.3s, background 0.3s;
  }
  .sidebar.collapsed { margin-left: -320px; }
  .sidebar-tabs {
    display: flex; border-bottom: 1px solid var(--border-light);
  }
  .sidebar-tab {
    flex: 1; padding: 12px; border: none; background: transparent;
    font-size: 12px; cursor: pointer; color: var(--text-muted);
    font-family: inherit; transition: all 0.2s;
    border-bottom: 2px solid transparent;
    display: flex; align-items: center; justify-content: center; gap: 5px;
  }
  .sidebar-tab.active { color: var(--text); font-weight: 600; border-bottom-color: var(--text); }
  .sidebar-tab:hover { color: var(--text-secondary); }
  .sidebar-panel { flex: 1; overflow-y: auto; display: none; }
  .sidebar-panel.active { display: block; }
  .sidebar-body { padding: 16px 18px; }

  /* 历史记录列表 */
  .history-list { display: flex; flex-direction: column; gap: 2px; }
  .history-item {
    padding: 12px 14px; border-radius: 8px; cursor: pointer;
    transition: background 0.15s; position: relative;
    border: 1px solid transparent;
  }
  .history-item:hover { background: var(--bg-secondary); }
  .history-item.active { background: var(--bg-secondary); border-color: var(--border); }
  .history-item-title {
    font-size: 13px; font-weight: 500; color: var(--text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    padding-right: 24px;
  }
  .history-item-meta {
    font-size: 11px; color: var(--text-muted); margin-top: 4px;
    display: flex; gap: 8px; align-items: center;
  }
  .history-item-mode {
    padding: 1px 6px; border-radius: 4px; font-size: 10px;
    background: var(--bg-tertiary); color: var(--text-secondary);
  }
  .history-item-del {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    width: 24px; height: 24px; border: none; background: transparent;
    cursor: pointer; color: var(--text-muted); border-radius: 4px;
    display: flex; align-items: center; justify-content: center;
    opacity: 0; transition: opacity 0.15s;
  }
  .history-item:hover .history-item-del { opacity: 1; }
  .history-item-del:hover { color: #c0392b; background: var(--bg-tertiary); }
  .history-empty {
    text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 13px;
  }
  .history-clear {
    margin: 12px 18px; padding: 8px; border: 1px solid var(--border);
    background: transparent; border-radius: 8px; cursor: pointer;
    font-size: 12px; color: var(--text-muted); font-family: inherit;
    transition: all 0.2s;
  }
  .history-clear:hover { color: #c0392b; border-color: #c0392b; }

  .form-group { margin-bottom: 18px; }
  .form-label {
    font-size: 12px; color: var(--text-muted);
    margin-bottom: 7px; display: block; letter-spacing: 0.5px;
  }
  .form-select, .form-input, .form-textarea {
    width: 100%; padding: 9px 12px;
    border: 1px solid var(--border); border-radius: 8px;
    font-size: 13px; background: var(--bg); color: var(--text);
    outline: none; font-family: inherit; transition: border-color 0.2s;
  }
  .form-textarea { resize: vertical; min-height: 120px; line-height: 1.6; }
  .form-select:focus, .form-input:focus, .form-textarea:focus { border-color: var(--text-muted); }
  .card-slots { display: flex; flex-direction: column; gap: 12px; }
  .card-slot {
    border: 1px solid var(--border-light); border-radius: 10px;
    padding: 12px; background: var(--bg);
  }
  .card-slot-header {
    display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;
  }
  .card-slot-num { font-size: 12px; font-weight: 600; color: var(--text-secondary); }
  .orientation-toggle { display: flex; background: var(--bg-secondary); border-radius: 6px; overflow: hidden; }
  .ori-btn {
    padding: 4px 10px; border: none; background: transparent;
    font-size: 11px; cursor: pointer; color: var(--text-muted);
    font-family: inherit; transition: all 0.2s;
  }
  .ori-btn.active.upright { background: #2d7a4a; color: #fff; }
  .ori-btn.active.reversed { background: #b83838; color: #fff; }
  .card-input-row { display: flex; gap: 6px; align-items: center; }
  .card-input-row .form-input { flex: 1; }
  .card-preview { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .card-thumb {
    width: 44px; height: 73px; border-radius: 4px; overflow: hidden;
    border: 1px solid var(--border); background: var(--bg-secondary); flex-shrink: 0;
  }
  .card-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card-thumb.reversed img { transform: rotate(180deg); }
  .card-thumb-placeholder {
    width: 44px; height: 73px; border-radius: 4px;
    border: 1px dashed var(--border); background: var(--bg-secondary);
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; color: var(--text-muted); flex-shrink: 0;
  }
  .selected-card-name { font-size: 12px; color: var(--text-secondary); line-height: 1.4; }
  .selected-card-name .name { font-weight: 600; color: var(--text); }
  .selected-card-name .ori { font-size: 11px; margin-top: 2px; }
  .ori-up { color: #2d7a4a; }
  .ori-rev { color: #b83838; }
  .input-hint-small { font-size: 10px; color: var(--text-muted); margin-top: 4px; }

  /* 聊天区 */
  .chat-area { flex: 1; display: flex; flex-direction: column; background: var(--bg); min-width: 0; transition: background 0.3s; }
  .chat-messages { flex: 1; overflow-y: auto; padding: 24px 0; }
  .msg { display: flex; margin-bottom: 20px; gap: 12px; }
  .msg.user { flex-direction: row-reverse; }
  .msg-avatar {
    width: 32px; height: 32px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; flex-shrink: 0;
  }
  .msg.user .msg-avatar { background: var(--user-msg); color: var(--user-msg-text); font-weight: 600; }
  .msg.ai .msg-avatar { background: var(--ai-msg); border: 1px solid var(--border); color: var(--text-secondary); }
  .msg-bubble {
    max-width: 70%; padding: 12px 16px; border-radius: 12px;
    font-size: 14px; line-height: 1.7; word-wrap: break-word;
  }
  .msg.user .msg-bubble {
    background: var(--user-msg); color: var(--user-msg-text);
    border-bottom-right-radius: 4px;
  }
  .msg.ai .msg-bubble {
    background: var(--ai-msg); border: 1px solid var(--border-light);
    border-bottom-left-radius: 4px; box-shadow: var(--shadow);
  }
  .msg.ai .msg-bubble h3 { font-size: 14px; margin: 12px 0 6px; color: var(--text); font-weight: 600; }
  .msg.ai .msg-bubble h3:first-child { margin-top: 0; }
  .msg.ai .msg-bubble strong { color: var(--text); }
  .msg.ai .msg-bubble p { margin-bottom: 8px; }
  .msg-cards {
    display: flex; flex-wrap: wrap; gap: 10px;
    margin: 12px 0; padding: 12px;
    background: var(--bg-secondary); border-radius: 10px;
  }
  .msg-card-item { display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .msg-card-img {
    width: 60px; height: 100px; border-radius: 5px; overflow: hidden;
    border: 1px solid var(--border); background: var(--ai-msg);
  }
  .msg-card-img img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .msg-card-img.reversed img { transform: rotate(180deg); }
  .msg-card-label { font-size: 10px; color: var(--text-muted); text-align: center; max-width: 65px; line-height: 1.3; }
  .msg-card-label .ori { display: block; font-weight: 600; }
  .typing-indicator { display: flex; gap: 4px; padding: 4px 0; }
  .typing-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--text-muted); animation: typing 1.4s infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }
  @keyframes typing {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-5px); opacity: 1; }
  }
  .welcome-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; text-align: center; color: var(--text-muted);
  }
  .welcome-icon { font-size: 48px; margin-bottom: 16px; opacity: 0.4; display: flex; color: var(--text-muted); }
  .welcome-title { font-size: 18px; color: var(--text-secondary); margin-bottom: 8px; font-weight: 600; }
  .welcome-desc { font-size: 13px; max-width: 400px; line-height: 1.7; }

  /* 输入区 */
  .chat-input-area {
    border-top: 1px solid var(--border); background: var(--ai-msg);
    padding: 16px 24px 20px; transition: background 0.3s;
  }
  .chat-input-container {
    max-width: 800px; margin: 0 auto;
    display: flex; gap: 10px; align-items: flex-end;
  }
  .chat-input {
    flex: 1; padding: 12px 16px;
    border: 1px solid var(--border); border-radius: 12px;
    font-size: 14px; font-family: inherit;
    resize: none; outline: none;
    min-height: 46px; max-height: 150px; line-height: 1.5;
    transition: border-color 0.2s; background: var(--bg); color: var(--text);
  }
  .chat-input:focus { border-color: var(--text-muted); background: var(--ai-msg); }
  .send-btn {
    width: 46px; height: 46px; border: none;
    background: var(--accent); color: var(--accent-text);
    border-radius: 12px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; flex-shrink: 0;
  }
  .send-btn:hover { opacity: 0.85; }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .input-hint {
    max-width: 800px; margin: 6px auto 0;
    font-size: 11px; color: var(--text-muted);
    display: flex; justify-content: space-between;
  }

  /* 弹窗 */
  .modal-overlay {
    position: fixed; inset: 0; background: var(--overlay);
    display: none; align-items: center; justify-content: center; z-index: 100;
  }
  .modal-overlay.show { display: flex; }
  .modal {
    background: var(--ai-msg); border-radius: 14px;
    padding: 28px; width: 480px; max-width: 90vw;
    max-height: 85vh; display: flex; flex-direction: column;
    box-shadow: var(--shadow-md); transition: background 0.3s;
  }
  .modal.wide { width: 640px; }
  .modal-title {
    font-size: 17px; font-weight: 600; margin-bottom: 20px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .modal-close {
    border: none; background: none; font-size: 20px;
    cursor: pointer; color: var(--text-muted); line-height: 1;
    width: 28px; height: 28px; display: flex; align-items: center; justify-content: center;
    border-radius: 6px;
  }
  .modal-close:hover { background: var(--bg-secondary); }
  .modal-body { flex: 1; overflow-y: auto; }
  .modal .form-group { margin-bottom: 16px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 22px; }
  .btn-primary {
    flex: 1; padding: 10px; border: none;
    background: var(--accent); color: var(--accent-text);
    border-radius: 8px; cursor: pointer;
    font-size: 14px; font-family: inherit; font-weight: 500;
  }
  .btn-secondary {
    padding: 10px 18px; border: 1px solid var(--border);
    background: var(--ai-msg); color: var(--text);
    border-radius: 8px; cursor: pointer;
    font-size: 14px; font-family: inherit;
    display: flex; align-items: center; gap: 6px;
  }
  .btn-secondary:hover { background: var(--bg-secondary); }
  .api-status {
    font-size: 12px; margin-top: 8px; padding: 8px 12px;
    border-radius: 6px; display: none;
  }
  .api-status.success { display: block; background: rgba(45,122,74,0.1); color: #2d7a4a; }
  .api-status.error { display: block; background: rgba(184,56,56,0.1); color: #b83838; }
  .model-list-item {
    padding: 9px 14px; border: none; background: transparent;
    text-align: left; font-size: 13px; cursor: pointer;
    color: var(--text); font-family: inherit;
    border-bottom: 1px solid var(--border-light);
    transition: background 0.15s;
  }
  .model-list-item:last-child { border-bottom: none; }
  .model-list-item:hover { background: var(--bg-secondary); }

  /* 世界观编辑器 */
  .wv-mode-tabs {
    display: flex; gap: 8px; margin-bottom: 14px;
    background: var(--bg-secondary); padding: 4px; border-radius: 8px;
  }
  .wv-mode-tab {
    flex: 1; padding: 8px; border: none; background: transparent;
    font-size: 13px; cursor: pointer; border-radius: 6px;
    color: var(--text-secondary); font-family: inherit; transition: all 0.2s;
  }
  .wv-mode-tab.active { background: var(--ai-msg); color: var(--text); font-weight: 600; box-shadow: var(--shadow); }
  .wv-meta {
    font-size: 11px; color: var(--text-muted);
    margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center;
  }
  .wv-custom-badge {
    font-size: 10px; padding: 2px 8px; border-radius: 10px;
    background: rgba(230,81,0,0.15); color: #e65100; font-weight: 600;
  }
  .wv-default-badge {
    font-size: 10px; padding: 2px 8px; border-radius: 10px;
    background: var(--bg-secondary); color: var(--text-muted);
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--text-muted); border-radius: 3px; opacity: 0.5; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-secondary); }

  /* 更多功能弹出菜单 */
  .more-menu {
    position: fixed;
    top: 58px;
    right: 16px;
    background: var(--ai-msg);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: var(--shadow-md);
    padding: 10px;
    display: none;
    z-index: 50;
    width: 280px;
    transition: background 0.3s;
  }
  .more-menu.show { display: block; }
  .more-menu-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 6px;
    margin-bottom: 8px;
  }
  .more-menu-item {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 11px 12px;
    border: 1px solid var(--border-light);
    background: var(--bg);
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text);
    font-family: inherit;
    text-align: left;
    transition: all 0.15s;
  }
  .more-menu-item:hover { background: var(--bg-secondary); border-color: var(--border); }
  .more-menu-item:active { transform: scale(0.97); }
  .more-menu-full {
    width: 100%;
    justify-content: center;
    font-weight: 600;
    background: var(--accent);
    color: var(--accent-text);
    border-color: transparent;
  }
  .more-menu-full:hover { background: var(--accent); opacity: 0.85; }

  /* 侧边栏遮罩（移动端） */
  .sidebar-overlay {
    display: none;
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.5); z-index: 15;
  }
  .sidebar-overlay.show { display: block; }

  @media (max-width: 768px) {
    body { font-size: 15px; -webkit-tap-highlight-color: transparent; }

    /* 顶部栏 */
    .topbar { height: 50px; padding: 0 12px; gap: 8px; }
    .topbar-title { font-size: 14px; gap: 6px; }
    .topbar-title .svg-icon { width: 18px; height: 18px; }
    .mode-switch { margin-left: 8px; padding: 2px; }
    .mode-btn { padding: 5px 10px; font-size: 12px; }
    .topbar-right { gap: 5px; }
    .icon-btn { width: 38px; height: 38px; min-width: 38px; min-height: 38px; }
    .new-chat-btn { padding: 6px 10px; font-size: 12px; gap: 4px; }
    .new-chat-btn span { display: none; }

    /* 侧边栏抽屉式 */
    .sidebar {
      position: fixed; left: 0; top: 50px; bottom: 0;
      width: 82vw; max-width: 320px; min-width: 0;
      z-index: 20; box-shadow: var(--shadow-md);
      margin-left: -100%; transition: margin-left 0.3s;
    }
    .sidebar.mobile-open { margin-left: 0; }

    /* 主体 */
    .main { height: calc(100vh - 50px); }

    /* 聊天消息 */
    .chat-messages { padding: 16px 0; }
    .msg { gap: 8px; margin-bottom: 16px; padding: 0 12px; }
    .msg-avatar { width: 30px; height: 30px; font-size: 11px; }
    .msg-bubble { max-width: 78%; padding: 10px 14px; font-size: 14px; line-height: 1.65; }
    .msg-cards { gap: 8px; padding: 10px; }
    .msg-card-img { width: 52px; height: 87px; }
    .msg-card-label { font-size: 9px; max-width: 56px; }

    /* 欢迎页 */
    .welcome-screen { padding: 20px; }
    .welcome-title { font-size: 16px; }
    .welcome-desc { font-size: 13px; }

    /* 输入区 */
    .chat-input-area { padding: 10px 12px 14px; }
    .chat-input-container { gap: 8px; }
    .chat-input { padding: 11px 14px; font-size: 15px; min-height: 44px; border-radius: 10px; }
    .send-btn { width: 44px; height: 44px; min-width: 44px; border-radius: 10px; }
    .input-hint { font-size: 10px; padding: 0 2px; }

    /* 侧边栏内容 */
    .sidebar-body { padding: 14px; }
    .form-label { font-size: 12px; }
    .form-select, .form-input { padding: 10px 12px; font-size: 14px; min-height: 42px; }
    .card-slot { padding: 10px; }
    .card-slot-num { font-size: 12px; }
    .ori-btn { padding: 5px 10px; font-size: 11px; min-height: 30px; }
    .card-thumb { width: 40px; height: 66px; }
    .card-thumb-placeholder { width: 40px; height: 66px; font-size: 16px; }

<!-- 顶部栏 -->

<!-- 更多功能弹出菜单 -->
<div class="more-menu" id="moreMenu">

<div class="main">
  <!-- 侧边栏 -->

<script>
// ===== 78张牌数据 =====
const allCards = [
  {id:"00",name:"愚者",en:"The Fool",file:"00_Fool.png",type:"大阿卡纳"},
  {id:"01",name:"魔术师",en:"The Magician",file:"01_Magician.png",type:"大阿卡纳"},
  {id:"02",name:"女祭司",en:"The High Priestess",file:"02_High_Priestess.png",type:"大阿卡纳"},
  {id:"03",name:"皇后",en:"The Empress",file:"03_Empress.png",type:"大阿卡纳"},
  {id:"04",name:"皇帝",en:"The Emperor",file:"04_Emperor.png",type:"大阿卡纳"},
  {id:"05",name:"教皇",en:"The Hierophant",file:"05_Hierophant.png",type:"大阿卡纳"},
  {id:"06",name:"恋人",en:"The Lovers",file:"06_Lovers.png",type:"大阿卡纳"},
  {id:"07",name:"战车",en:"The Chariot",file:"07_Chariot.png",type:"大阿卡纳"},
  {id:"08",name:"力量",en:"Strength",file:"08_Strength.png",type:"大阿卡纳"},
  {id:"09",name:"隐士",en:"The Hermit",file:"09_Hermit.png",type:"大阿卡纳"},
  {id:"10",name:"命运之轮",en:"Wheel of Fortune",file:"10_Wheel_of_Fortune.png",type:"大阿卡纳"},
  {id:"11",name:"正义",en:"Justice",file:"11_Justice.png",type:"大阿卡纳"},
  {id:"12",name:"倒吊人",en:"The Hanged Man",file:"12_Hanged_Man.png",type:"大阿卡纳"},
  {id:"13",name:"死神",en:"Death",file:"13_Death.png",type:"大阿卡纳"},
  {id:"14",name:"节制",en:"Temperance",file:"14_Temperance.png",type:"大阿卡纳"},
  {id:"15",name:"恶魔",en:"The Devil",file:"15_Devil.png",type:"大阿卡纳"},
  {id:"16",name:"高塔",en:"The Tower",file:"16_Tower.png",type:"大阿卡纳"},
  {id:"17",name:"星星",en:"The Star",file:"17_Star.png",type:"大阿卡纳"},
  {id:"18",name:"月亮",en:"The Moon",file:"18_Moon.png",type:"大阿卡纳"},
  {id:"19",name:"太阳",en:"The Sun",file:"19_Sun.png",type:"大阿卡纳"},
  {id:"20",name:"审判",en:"Judgement",file:"20_Judgement.png",type:"大阿卡纳"},
  {id:"21",name:"世界",en:"The World",file:"21_World.png",type:"大阿卡纳"},
];
const suits = [
  {key:"Cups",name:"圣杯",cards:["1","二","三","四","五","六","七","八","九","十","侍从","骑士","王后","国王"]},
  {key:"Pents",name:"星币",cards:["1","二","三","四","五","六","七","八","九","十","侍从","骑士","王后","国王"]},
  {key:"Swords",name:"宝剑",cards:["1","二","三","四","五","六","七","八","九","十","侍从","骑士","王后","国王"]},
  {key:"Wands",name:"权杖",cards:["1","二","三","四","五","六","七","八","九","十","侍从","骑士","王后","国王"]},
];
suits.forEach(function(suit) {
  suit.cards.forEach(function(cn, i) {
    var num = ("0" + (i+1)).slice(-2);
    var enNum = ["Ace","Two","Three","Four","Five","Six","Seven","Eight","Nine","Ten","Page","Knight","Queen","King"][i];
    allCards.push({
      id: suit.key.charAt(0)+num,
      name: suit.name + cn,
      en: enNum + " of " + (suit.key==="Pents"?"Pentacles":suit.key),
      file: suit.key + num + ".png",
      type: suit.name
    });
  });
});

// 填充datalist
(function() {
  var dl = document.getElementById('cardDatalist');
  allCards.forEach(function(c) {
    var opt = document.createElement('option');
    opt.value = c.name + ' · ' + c.en;
    dl.appendChild(opt);
  });
})();

// ===== 默认世界观 =====

// ===== 牌输入（下拉+手动输入） =====
function findCardByName(input) {
  if (!input) return null;
  var s = input.trim();
  var sl = s.toLowerCase();
  // 精确匹配中文名
  var exact = allCards.find(function(c) { return c.name === s; });
  if (exact) return exact;
  // 匹配 "中文名 · 英文名" 格式
  var parts = s.split('·');
  if (parts.length >= 1) {
    var byName = allCards.find(function(c) { return c.name === parts[0].trim(); });
    if (byName) return byName;
  }
  // 模糊匹配中文名或英文名
  var fuzzy = allCards.find(function(c) {
    return c.name.toLowerCase().indexOf(sl) >= 0 || c.en.toLowerCase().indexOf(sl) >= 0;
  });
  return fuzzy || null;
}

function renderCardSlots() {
  var count = parseInt(document.getElementById('cardCount').value);
  var old = selectedCards.slice();
  selectedCards = [];
  for (var i = 0; i < count; i++) {
    selectedCards.push(old[i] || {cardId: null, reversed: false, inputText: ''});
  }
  var container = document.getElementById('cardSlots');
  container.innerHTML = '';
  for (var i = 0; i < count; i++) {
    container.appendChild(createCardSlot(i));
  }
  updateCardSummary();
}

function createCardSlot(index) {
  var slot = document.createElement('div');
  slot.className = 'card-slot';
  var sel = selectedCards[index];
  var card = sel.cardId ? allCards.find(function(c){return c.id===sel.cardId;}) : null;

  slot.innerHTML =
    '<div class="card-slot-header">' +
      '<span class="card-slot-num">第 ' + (index+1) + ' 张</span>' +
      '<div class="orientation-toggle">' +
        '<button class="ori-btn upright '+(sel.reversed?'':'active')+'" onclick="setOrientation('+index+',false)">正位</button>' +
        '<button class="ori-btn reversed '+(sel.reversed?'active':'')+'" onclick="setOrientation('+index+',true)">逆位</button>' +
      '</div>' +
    '</div>' +
    '<div class="card-input-row">' +
      '<input class="form-input" list="cardDatalist" placeholder="选择或输入牌名…" value="'+(sel.inputText || (card ? card.name+' · '+card.en : ''))+'" oninput="onCardInput('+index+',this.value)" onblur="onCardInputBlur('+index+',this)">' +
    '</div>' +
    '<div class="input-hint-small">可下拉选择，也可直接输入牌名（如"愚者"、"The Fool"）</div>' +
    '<div class="card-preview">' +
      (card ?
        '<div class="card-thumb'+(sel.reversed?' reversed':'')+'"><img src="cards/'+card.file+'" alt="'+card.name+'"></div>' +
        '<div class="selected-card-name"><span class="name">'+card.name+'</span><br><span class="ori '+(sel.reversed?'ori-rev':'ori-up')+'">'+(sel.reversed?'逆位':'正位')+' · '+card.en+'</span></div>'
        :
        '<div class="card-thumb-placeholder">?</div>' +
        '<div class="selected-card-name" style="color:var(--text-muted)">'+(sel.inputText ? '未匹配到牌，请检查输入' : '尚未选择')+'</div>'
      ) +
    '</div>';
  return slot;
}

function onCardInput(index, value) {
  selectedCards[index].inputText = value;
  var card = findCardByName(value);
  if (card) {
    selectedCards[index].cardId = card.id;
  } else {
    selectedCards[index].cardId = null;
  }
  updateCardSummary();
}
function onCardInputBlur(index, inputEl) {
  var card = findCardByName(inputEl.value);
  if (card) {
    inputEl.value = card.name + ' · ' + card.en;
    selectedCards[index].inputText = inputEl.value;
    selectedCards[index].cardId = card.id;
  }
  renderCardSlots();
}
function setOrientation(index, reversed) {
  selectedCards[index].reversed = reversed;
  renderCardSlots();
}
function updateCardSummary() {
  var set = selectedCards.filter(function(c){return c.cardId;}).length;
  document.getElementById('cardSummary').textContent = '已设置 ' + set + ' / ' + selectedCards.length + ' 张牌';
}

// ===== 对话历史记录 =====
function getHistory() {
  try {
    return JSON.parse(localStorage.getItem('tarot_chat_history') || '[]');
  } catch(e) { return []; }
}
function saveHistory(list) {
  localStorage.setItem('tarot_chat_history', JSON.stringify(list));
}
function saveCurrentChat() {
  if (chatHistory.length === 0) return;
  var list = getHistory();
  var firstUserMsg = chatHistory.find(function(m){return m.role==='user';});
  var title = firstUserMsg ? firstUserMsg.content.replace(/\n\n【我抽到的牌】[\s\S]*$/, '').substring(0, 30) : '新对话';
  var setCards = selectedCards.filter(function(c){return c.cardId;});

  if (currentChatId) {
    // 更新已有对话
    var idx = list.findIndex(function(c){return c.id === currentChatId;});
    if (idx >= 0) {
      list[idx].title = title;
      list[idx].messages = chatHistory;
      list[idx].cards = setCards;
      list[idx].mode = currentMode;
      list[idx].updatedAt = Date.now();
    }
  } else {
    // 新建对话
    currentChatId = Date.now();
    list.unshift({
      id: currentChatId,
      title: title,
      mode: currentMode,
      cards: setCards,
      messages: chatHistory,
      createdAt: Date.now(),
      updatedAt: Date.now()
    });
  }
  // 最多保留50条
  if (list.length > 50) list = list.slice(0, 50);
  saveHistory(list);
}

function renderHistory() {
  var list = getHistory();
  var container = document.getElementById('historyList');
  if (list.length === 0) {
    container.innerHTML = '<div class="history-empty">暂无历史记录<br><br>开始一段对话后会自动保存</div>';
    return;
  }
  container.innerHTML = '';
  list.forEach(function(chat) {
    var item = document.createElement('div');
    item.className = 'history-item' + (chat.id === currentChatId ? ' active' : '');
    var date = new Date(chat.updatedAt);
    var dateStr = (date.getMonth()+1) + '/' + date.getDate() + ' ' +
      ('0'+date.getHours()).slice(-2) + ':' + ('0'+date.getMinutes()).slice(-2);
    item.innerHTML =
      '<div class="history-item-title">' + escapeHtml(chat.title) + '</div>' +
      '<div class="history-item-meta">' +
        '<span class="history-item-mode">' + (chat.mode==='dream'?'梦占':'现实') + '</span>' +
        '<span>' + chat.cards.length + '张牌</span>' +
        '<span>' + dateStr + '</span>' +
      '</div>' +
      '<button class="history-item-del" onclick="event.stopPropagation();deleteChat('+chat.id+')" title="删除">' +
        '<svg class="svg-icon svg-icon-stroke" style="width:13px;height:13px"><use href="#icon-trash"/></svg>' +
      '</button>';
    item.onclick = function() { loadChat(chat.id); };
    container.appendChild(item);
  });
}

function loadChat(id) {
  var list = getHistory();
  var chat = list.find(function(c){return c.id === id;});
  if (!chat) return;
  saveCurrentChat(); // 保存当前
  currentChatId = chat.id;
  currentMode = chat.mode;
  setMode(chat.mode);
  chatHistory = chat.messages;
  selectedCards = chat.cards.map(function(c){return {cardId:c.cardId, reversed:c.reversed, inputText:''};});
  document.getElementById('cardCount').value = Math.max(1, selectedCards.length);
  renderCardSlots();
  // 渲染消息
  var container = document.getElementById('chatMessages');
  container.innerHTML = '';
  var firstUser = true;
  chatHistory.forEach(function(msg) {
    if (msg.role === 'user') {
      var cleanText = msg.content.replace(/\n\n【我抽到的牌】[\s\S]*$/, '');
      addMessage('user', cleanText, firstUser && selectedCards.length > 0 ? selectedCards : null, true);
      firstUser = false;
    } else {
      addMessage('ai', msg.content, null, true);
    }
  });
  closeSidebar();
  switchSidebarPanel('cards');
}

function deleteChat(id) {
  if (!confirm('确定删除这条对话记录吗？')) return;
  var list = getHistory().filter(function(c){return c.id !== id;});
  saveHistory(list);
  if (currentChatId === id) {
    newChat(true);
  }
  renderHistory();
}

function clearAllHistory() {
  if (!confirm('确定清空全部历史记录吗？此操作不可恢复。')) return;
  saveHistory([]);
  renderHistory();
}

function escapeHtml(str) {
  var div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// ===== API 设置 =====
function openApiModal() {
  var cfg = loadApi();
  document.getElementById('apiBase').value = cfg.base || '';
  document.getElementById('apiKey').value = cfg.key || '';
  document.getElementById('apiModel').value = cfg.model || '';
  document.getElementById('apiStatus').style.display = 'none';
  document.getElementById('apiModal').classList.add('show');
}
function closeApiModal() { document.getElementById('apiModal').classList.remove('show'); }
function loadApi() {
  try { return JSON.parse(localStorage.getItem('tarot_chat_api') || '{}'); } catch(e) { return {}; }
}
function saveApi() {
  var cfg = {
    base: document.getElementById('apiBase').value.trim(),
    key: document.getElementById('apiKey').value.trim(),
    model: document.getElementById('apiModel').value.trim(),
  };
  localStorage.setItem('tarot_chat_api', JSON.stringify(cfg));
  showApiStatus('已保存', 'success');
  setTimeout(closeApiModal, 800);
}
async function testApi() {
  var cfg = {
    base: document.getElementById('apiBase').value.trim(),
    key: document.getElementById('apiKey').value.trim(),
    model: document.getElementById('apiModel').value.trim(),
  };
  if (!cfg.base || !cfg.key || !cfg.model) {
    showApiStatus('请填写完整的 API 地址、Key 和模型名', 'error');
    return;
  }
  showApiStatus('正在测试连接…', 'success');
  try {
    var res = await fetch(cfg.base.replace(/\/$/,'') + '/chat/completions', {
      method: 'POST',
      headers: {'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},
      body: JSON.stringify({model:cfg.model, messages:[{role:'user',content:'hi'}], max_tokens:10, stream:false})
    });
    if (res.ok) { showApiStatus('连接成功', 'success'); }
    else { showApiStatus('连接失败：HTTP ' + res.status, 'error'); }
  } catch(e) {
    showApiStatus('连接失败：' + e.message, 'error');
  }
}
function showApiStatus(msg, type) {
  var el = document.getElementById('apiStatus');
  el.textContent = msg;
  el.className = 'api-status ' + type;
}

async function fetchModels() {
  var base = document.getElementById('apiBase').value.trim();
  var key = document.getElementById('apiKey').value.trim();
  if (!base || !key) {
    showApiStatus('请先填写 API 地址和 Key', 'error');
    return;
  }
  showApiStatus('正在拉取模型列表…', 'success');
  try {
    var res = await fetch(base.replace(/\/$/,'') + '/models', {
      method: 'GET',
      headers: {'Authorization': 'Bearer ' + key}
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    var data = await res.json();
    var models = data.data || [];
    if (models.length === 0) {
      showApiStatus('未获取到模型列表', 'error');
      return;
    }
    var dl = document.getElementById('modelListDatalist');
    dl.innerHTML = '';
    var list = document.getElementById('modelList');
    list.innerHTML = '';
    models.forEach(function(m) {
      var name = m.id || m.name || m.model || '';
      if (!name) return;
      var opt = document.createElement('option');
      opt.value = name;
      dl.appendChild(opt);
      var item = document.createElement('button');
      item.className = 'model-list-item';
      item.textContent = name;
      item.onclick = function() {
        document.getElementById('apiModel').value = name;
        document.getElementById('modelListContainer').style.display = 'none';
      };
      list.appendChild(item);
    });
    document.getElementById('modelListContainer').style.display = 'block';
    showApiStatus('已拉取 ' + models.length + ' 个模型，点击选择', 'success');
  } catch(e) {
    showApiStatus('拉取失败：' + e.message, 'error');
  }
}

function getSystemPrompt() { return getWorldview(currentMode); }

// ===== 聊天 =====
function newChat(skipSave) {
  if (isGenerating) return;
  if (!skipSave) saveCurrentChat();
  chatHistory = [];
  currentChatId = null;
  document.getElementById('chatMessages').innerHTML =
    '<div class="welcome-screen" id="welcomeScreen">' +
      '<div class="welcome-icon"><svg class="svg-icon" style="width:48px;height:48px"><use href="#icon-tarot"/></svg></div>' +
      '<div class="welcome-title">在左侧设置你抽到的牌</div>' +
      '<div class="welcome-desc">选择牌的数量，逐张录入你抽到的牌和正逆位（可下拉选择或手动输入牌名），然后在下方输入问题，AI 将结合牌面解读。支持多轮追问。</div>' +
    '</div>';
  closeSidebar();
}

function sendMessage() {
  if (isGenerating) return;
  var input = document.getElementById('chatInput');
  var text = input.value.trim();
  if (!text) return;

  var cfg = loadApi();
  if (!cfg.base || !cfg.key || !cfg.model) {
    alert('请先点击右上角插头图标设置 API 接口');
    openApiModal();
    return;
  }

  var ws = document.getElementById('welcomeScreen');
  if (ws) ws.remove();

  var setCards = selectedCards.filter(function(c){return c.cardId;});
  var userContent = text;
  if (chatHistory.length === 0 && setCards.length > 0) {
    var cardInfo = '\n\n【我抽到的牌】\n';
    setCards.forEach(function(sc, i) {
      var c = allCards.find(function(x){return x.id===sc.cardId;});
      cardInfo += (i+1) + '. ' + c.name + '（' + c.en + '）—— ' + (sc.reversed?'逆位':'正位') + '\n';
    });
    userContent = text + cardInfo;
  }

  addMessage('user', text, setCards.length > 0 && chatHistory.length === 0 ? setCards : null);
  chatHistory.push({role:'user', content: userContent});
  input.value = '';
  input.style.height = 'auto';

  var typingId = addTyping();
  isGenerating = true;
  document.getElementById('sendBtn').disabled = true;

  var messages = [{role:'system', content: getSystemPrompt()}].concat(chatHistory);
  fetch(cfg.base.replace(/\/$/,'') + '/chat/completions', {
    method: 'POST',
    headers: {'Content-Type':'application/json','Authorization':'Bearer '+cfg.key},
    body: JSON.stringify({
      model: cfg.model,
      messages: messages,
      temperature: 0.7,
      max_tokens: 3500,
      stream: false
    })
  })
  .then(function(res){ return res.json(); })
  .then(function(data) {
    removeTyping(typingId);
    var content = '';
    if (data.choices && data.choices[0]) {
      content = data.choices[0].message?.content || data.choices[0].text || '';
    }
    if (content) {
      addMessage('ai', content);
      chatHistory.push({role:'assistant', content: content});
    } else {
      addMessage('ai', '（API 返回内容为空，请检查模型名和 Key 是否正确，或换一个模型试试。）');
    }
    saveCurrentChat();
    renderHistory();
  })
  .catch(function(err) {
    removeTyping(typingId);
    addMessage('ai', '请求出错：' + err.message + '\n\n请检查 API 地址和网络连接。');
  })
  .finally(function() {
    isGenerating = false;
    document.getElementById('sendBtn').disabled = false;
  });
}

function addMessage(role, text, cards, skipScroll) {
  var container = document.getElementById('chatMessages');
  var msg = document.createElement('div');
  msg.className = 'msg ' + role;

  var avatar = document.createElement('div');
  avatar.className = 'msg-avatar';
  if (role === 'user') {
    avatar.textContent = '我';
  } else {
    avatar.innerHTML = '<svg class="svg-icon" style="width:16px;height:16px"><use href="#icon-tarot"/></svg>';
  }

  var bubble = document.createElement('div');
  bubble.className = 'msg-bubble';

  if (cards && cards.length > 0) {
    var cardDiv = document.createElement('div');
    cardDiv.className = 'msg-cards';
    cards.forEach(function(sc) {
      var c = allCards.find(function(x){return x.id===sc.cardId;});
      if (!c) return;
      var item = document.createElement('div');
      item.className = 'msg-card-item';
      item.innerHTML =
        '<div class="msg-card-img'+(sc.reversed?' reversed':'')+'"><img src="cards/'+c.file+'" alt="'+c.name+'"></div>' +
        '<div class="msg-card-label">'+c.name+'<span class="ori '+(sc.reversed?'ori-rev':'ori-up')+'">'+(sc.reversed?'逆位':'正位')+'</span></div>';
      cardDiv.appendChild(item);
    });
    bubble.appendChild(cardDiv);
  }

  var formatted = text
    .replace(/^### (.*$)/gm, '<h3>$1</h3>')
    .replace(/^## (.*$)/gm, '<h3>$1</h3>')
    .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
    .replace(/\n/g, '<br>');
  var textDiv = document.createElement('div');
  textDiv.innerHTML = formatted;
  bubble.appendChild(textDiv);

  msg.appendChild(avatar);
  msg.appendChild(bubble);
  container.appendChild(msg);
  if (!skipScroll) container.scrollTop = container.scrollHeight;
}

function addTyping() {
  var container = document.getElementById('chatMessages');
  var msg = document.createElement('div');
  msg.className = 'msg ai';
  msg.id = 'typing-' + Date.now();
  msg.innerHTML =
    '<div class="msg-avatar"><svg class="svg-icon" style="width:16px;height:16px"><use href="#icon-tarot"/></svg></div>' +
    '<div class="msg-bubble"><div class="typing-indicator"><div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div></div></div>';
  container.appendChild(msg);
  container.scrollTop = container.scrollHeight;
  return msg.id;
}
function removeTyping(id) {
  var el = document.getElementById(id);
  if (el) el.remove();
}

// ===== 输入框自适应 =====
var chatInput = document.getElementById('chatInput');
chatInput.addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 150) + 'px';
});
chatInput.addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage();
  }
});

// ===== 初始化 =====
loadTheme();
loadApi();
renderCardSlots();
renderHistory();
</script>
